<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emberline · wildfire copilot for California</title>
  <meta name="description" content="Emberline predicts where a California wildfire will spread in the next 3 hours, warns towns early, and checks the AI's evacuation plan with code before a person approves it. Replay the 2025 Eaton Fire.">
  <meta property="og:title" content="Emberline · wildfire copilot for California">
  <meta property="og:description" content="Emberline predicts where a California wildfire will spread in the next 3 hours, warns towns early, and checks the AI's evacuation plan with code before a person approves it. Replay the 2025 Eaton Fire.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#14171a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314171a'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23d9480f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/fonts/plex.css">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<!--
  Emberline copilot - one page, three modes (STATE / INCIDENT / REPLAY).
  The page skeleton is here; everything inside the side panel and the timeline is drawn by the JS in js/.
  data-mode on #app is set by js/main.js and is used by app.css to show/hide the timeline.
-->
<div id="app" data-mode="replay">

  <!-- ───────── TOP BAR ───────── -->
  <header id="topbar">
    <div class="brand"><span class="brand-mark"></span>EMBERLINE<span class="brand-sub">wildfire copilot</span></div>
    <nav id="mode-tabs" aria-label="Mode">
      <button data-mode="state">STATE</button>
      <button data-mode="incident">INCIDENT</button>
      <button data-mode="replay">REPLAY</button>
    </nav>
    <div class="topbar-spacer"></div>
    <div class="chip" id="clock-chip" title="Time of the data on screen"><span class="dot"></span><span id="clock-text">Loading…</span></div>
    <div class="chip" id="ai-chip" title="AI model used for briefings and plans">AI: …</div>
    <div class="seg" id="dim-toggle" title="Flat map or 3D terrain">
      <button data-dim="2d">2D</button><button data-dim="3d">3D</button>
    </div>
    <button class="btn btn-demo" id="demo-btn" title="Watch the 2-minute guided demo">▶ Demo</button>
    <button class="btn" id="results-btn">Results</button>
    <button class="btn btn-icon" id="settings-btn" title="Settings" aria-label="Settings">⚙</button>
    <div id="settings-menu" hidden></div>
  </header>

  <!-- ───────── MAP + SIDE PANEL ───────── -->
  <main id="main">
    <section id="map-area">
      <div id="map-wrap">
        <!-- left pane is only shown in split screen -->
        <div class="map-pane" id="pane-left" hidden>
          <div class="pane-title" id="pane-left-title"></div>
          <div class="map" id="map-left"></div>
        </div>
        <div class="map-pane" id="pane-main">
          <div class="pane-title" id="pane-main-title" hidden></div>
          <div class="map" id="map-main"></div>
        </div>
      </div>
      <div id="map-banner" hidden></div>
      <div id="layer-toggles" class="map-card" hidden></div>
      <div id="legend" class="map-card"></div>
      <div id="map-loading" hidden><span class="spinner"></span><span id="map-loading-text"></span></div>
    </section>

    <aside id="panel">
      <div id="panel-body"></div>
      <footer id="panel-foot">AI drafts, code checks the forecast, a human decides.</footer>
    </aside>
  </main>

  <!-- ───────── REPLAY TIMELINE (replay mode only) ───────── -->
  <footer id="timeline"></footer>

  <!-- ───────── RESULTS DRAWER ───────── -->
  <div id="results-backdrop" hidden></div>
  <aside id="results-drawer" hidden aria-label="Test results"></aside>

  <div id="tooltip" hidden></div>
</div>

<script src="vendor/maplibre/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
